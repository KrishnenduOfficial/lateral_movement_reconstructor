[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lmr"
version = "0.1.0"
description = "Lateral Movement Reconstructor - Automated DFIR network analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "rich>=13.0.0",
    "colorama>=0.4.6",
    "rich-argparse>=1.4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
    "mypy>=1.8",
]

[project.scripts]
lmr = "lmr.cli:main"

[tool.mypy]
ignore_missing_imports = true
allow_redefinition = true